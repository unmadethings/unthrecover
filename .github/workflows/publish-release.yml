name: Publish release

# Publishes a DRAFT release (after a maintainer approved it) and smoke-tests the
# published binary on a clean runner. Run manually:
#   tag      - existing draft release tag, e.g. v0.1.0-alpha
#   publish  - false = only run the clean-machine smoke test
# Release notes are taken from .github/release-notes/<tag>.md on the default branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to publish"
        required: true
        type: string
      publish:
        description: "Publish the draft (false = smoke test only)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "invalid tag"; exit 1; }
          test -f ".github/release-notes/$TAG.md" || { echo "missing release notes"; exit 1; }
      - name: Reconcile SHA256SUMS with asset names GitHub rewrote
        # GitHub replaces characters such as "~" in uploaded asset names. When a
        # SHA256SUMS entry has no asset of that name, it is renamed to the asset
        # whose content has exactly that hash. Hashes are never recomputed or
        # changed, so a modified asset still fails `sha256sum -c`.
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$d"
          cd "$d"
          changed=0
          : > SHA256SUMS.new
          while read -r hash name; do
            if [ ! -f "$name" ]; then
              for f in *; do
                [ "$f" = SHA256SUMS ] || [ "$f" = SHA256SUMS.new ] && continue
                if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$hash" ]; then
                  echo "renaming entry $name -> $f (same sha256)"; name=$f; changed=1; break
                fi
              done
            fi
            printf '%s  %s\n' "$hash" "$name" >> SHA256SUMS.new
          done < SHA256SUMS
          mv SHA256SUMS.new SHA256SUMS
          sha256sum -c SHA256SUMS
          if [ "$changed" = 1 ]; then
            gh release upload "$TAG" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
          fi
      - name: Publish draft (or update notes of an already published release)
        run: |
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          [ -n "$rel" ] || { echo "no release for $TAG"; exit 1; }
          id=${rel%% *}; draft=${rel#* }
          if [ "$draft" = "true" ]; then
            echo "publishing draft $id"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F draft=false -F prerelease=true -f make_latest=false \
              -F "body=@.github/release-notes/$TAG.md" --jq '.html_url'
          else
            echo "release $id is already published; updating its notes only"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -F "body=@.github/release-notes/$TAG.md" --jq '.html_url'
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$TAG"

  smoke:
    needs: publish
    permissions:
      contents: read
      packages: read
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5   # only for the installer script and the synthetic dataset
      - name: Download published assets
        run: |
          mkdir -p "rel/$TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "rel/$TAG"
          ls -l "rel/$TAG"
          (cd "rel/$TAG" && sha256sum -c SHA256SUMS)
      - name: Install with scripts/install.sh (checksum-verified)
        run: |
          mkdir -p "$HOME/bin"
          sh scripts/install.sh --version "$TAG" --dir "$HOME/bin" --base-url "file://$PWD/rel"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: PostgreSQL client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Version and doctor
        run: |
          unth version | tee /dev/stderr | grep -q "$TAG"
          unth --data-dir "$RUNNER_TEMP/data" doctor
      - name: End-to-end recovery proof with the released binary
        run: |
          set -euo pipefail
          export UNTH_DATA_DIR="$RUNNER_TEMP/data"
          openssl rand -hex 16 > "$RUNNER_TEMP/src.pass"; chmod 600 "$RUNNER_TEMP/src.pass"
          docker run -d --name smoke-src --label io.unthrecover.test=smoke \
            -e POSTGRES_PASSWORD="$(cat "$RUNNER_TEMP/src.pass")" -e POSTGRES_DB=shop -p 127.0.0.1:55432:5432 postgres:16-alpine
          for i in $(seq 1 60); do
            PGPASSWORD="$(cat "$RUNNER_TEMP/src.pass")" psql -h 127.0.0.1 -p 55432 -U postgres -d shop -c 'select 1' >/dev/null 2>&1 && break; sleep 1
          done
          PGPASSWORD="$(cat "$RUNNER_TEMP/src.pass")" psql -q -h 127.0.0.1 -p 55432 -U postgres -d shop -v ON_ERROR_STOP=1 -f tests/fixtures/seed.sql
          cat > "$RUNNER_TEMP/job.yaml" <<EOF
          version: 1
          source:
            name: smoke-shop
            host: 127.0.0.1
            port: 55432
            database: shop
            user: postgres
            password_file: $RUNNER_TEMP/src.pass
            sslmode: disable
          verification:
            restore_image: postgres:16-alpine
            queries:
              - name: paid_total
                sql: SELECT sum(total_cents) FROM orders WHERE status = 'paid'
          EOF
          unth discover postgres --config "$RUNNER_TEMP/job.yaml"
          id=$(unth backup postgres --config "$RUNNER_TEMP/job.yaml" --format json | jq -r .id)
          unth verify "$id"
          unth report "$id" --format json | jq -e '.final_status == "VERIFIED"'
          # corrupted artifact must never be verified
          printf 'x' | dd of="$UNTH_DATA_DIR/backups/$id/artifact.dump" bs=1 seek=1000 conv=notrunc 2>/dev/null
          set +e; unth verify "$id"; code=$?; set -e
          [ "$code" -eq 3 ] || { echo "corrupted backup: expected exit 3, got $code"; exit 1; }
          unth cleanup
      - name: "v0.2+: scheduled job with retention, web panel login"
        if: inputs.tag != 'v0.1.0-alpha'
        run: |
          set -euo pipefail
          export UNTH_DATA_DIR="$RUNNER_TEMP/data2"
          cat > "$RUNNER_TEMP/job2.yaml" <<EOF
          version: 1
          source:
            name: smoke-run
            host: 127.0.0.1
            port: 55432
            database: shop
            user: postgres
            password_file: $RUNNER_TEMP/src.pass
            sslmode: disable
          verification:
            restore_image: postgres:16-alpine
          retention:
            keep_last: 1
          EOF
          unth run --config "$RUNNER_TEMP/job2.yaml"
          unth run --config "$RUNNER_TEMP/job2.yaml"
          unth backup list | tee /dev/stderr | grep -q EXPIRED
          token=$(openssl rand -hex 24)
          UNTH_UI_TOKEN="$token" unth serve --listen 127.0.0.1:18484 > "$RUNNER_TEMP/serve.log" 2>&1 &
          spid=$!
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:18484/ && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18484/api/overview)" = 401
          curl -fsS -c "$RUNNER_TEMP/cj" -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}" http://127.0.0.1:18484/api/login >/dev/null
          curl -fsS -b "$RUNNER_TEMP/cj" http://127.0.0.1:18484/api/overview | jq -e '.protected_workloads >= 1 and .last_verified_backup_at != null'
          kill "$spid" || true
          ! grep -q "$token" "$RUNNER_TEMP/serve.log"
      - name: "v0.2+: .deb package installs on Ubuntu"
        if: inputs.tag != 'v0.1.0-alpha'
        run: |
          set -euo pipefail
          sudo apt-get install -y -q ./rel/"$TAG"/unthrecover_*_amd64.deb
          /usr/bin/unth version | grep -q "$TAG"
          id unth
          test -f /lib/systemd/system/unth@.service && test -f /lib/systemd/system/unth@.timer
          sudo stat -c '%a %U' /var/lib/unthrecover | grep -q '^700 unth$'
      - name: "v0.2+: container image from GHCR"
        if: inputs.tag != 'v0.1.0-alpha'
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/${GITHUB_REPOSITORY}:$TAG"
          docker run --rm "ghcr.io/${GITHUB_REPOSITORY}:$TAG" version | grep -q "$TAG"
          docker run --rm --entrypoint sh "ghcr.io/${GITHUB_REPOSITORY}:$TAG" -c 'ls /usr/lib/postgresql' | tr '\n' ' '
      - name: "v0.3+: .rpm installs on Rocky Linux 9; compose.yaml pins this release"
        if: inputs.tag != 'v0.1.0-alpha' && inputs.tag != 'v0.2.0-alpha'
        run: |
          set -euo pipefail
          sh scripts/test-rpm.sh rel/"$TAG"/unthrecover_*_amd64.rpm rockylinux:9
          grep -q "ghcr.io/unmadethings/unthrecover:$TAG}" rel/"$TAG"/compose.yaml
          cd "$RUNNER_TEMP" && mkdir -p composetest/jobs && cd composetest
          cp "$GITHUB_WORKSPACE/rel/$TAG/compose.yaml" .
          printf 'UNTH_UI_TOKEN=%s\nDOCKER_GID=%s\n' "$(openssl rand -hex 24)" "$(stat -c %g /var/run/docker.sock)" > .env
          docker compose config --quiet
      - name: "v0.3+: encrypted offsite copy with the released binary (rclone remote) and rclone in the image"
        if: inputs.tag != 'v0.1.0-alpha' && inputs.tag != 'v0.2.0-alpha'
        run: |
          set -euo pipefail
          sudo sh scripts/install-rclone.sh
          export UNTH_DATA_DIR="$RUNNER_TEMP/data3"
          unth keys generate --dir "$RUNNER_TEMP/keys"
          printf '[smoke]\ntype = local\n' > "$RUNNER_TEMP/rclone.conf"
          cat > "$RUNNER_TEMP/job3.yaml" <<EOF
          version: 1
          source:
            name: smoke-offsite
            host: 127.0.0.1
            port: 55432
            database: shop
            user: postgres
            password_file: $RUNNER_TEMP/src.pass
            sslmode: disable
          verification:
            restore_image: postgres:16-alpine
          encryption:
            identity_file: $RUNNER_TEMP/keys/age.key
          signing:
            key_file: $RUNNER_TEMP/keys/sign.key
          offsite:
            type: rclone
            remote: "smoke:$RUNNER_TEMP/remote"
            rclone_config: $RUNNER_TEMP/rclone.conf
          EOF
          unth run --config "$RUNNER_TEMP/job3.yaml" | tee "$RUNNER_TEMP/run3.log"
          grep -q "Offsite:       REMOTE_VERIFIED" "$RUNNER_TEMP/run3.log"
          id=$(unth backup list --format json | jq -r '.[0].id')
          UNTH_DATA_DIR="$RUNNER_TEMP/data4" unth offsite fetch --config "$RUNNER_TEMP/job3.yaml" "$id"
          UNTH_DATA_DIR="$RUNNER_TEMP/data4" unth verify "$id"
          if grep -rq "CREATE TABLE" "$RUNNER_TEMP/remote"; then echo "plaintext dump on the remote"; exit 1; fi
          docker run --rm --entrypoint rclone "ghcr.io/${GITHUB_REPOSITORY}:$TAG" version | head -1
      - name: Leftover resource check
        if: always()
        run: |
          docker rm -f -v smoke-src >/dev/null 2>&1 || true
          left=$(docker ps -aq --filter label=io.unthrecover.managed=true; docker volume ls -q --filter label=io.unthrecover.managed=true; docker network ls -q --filter label=io.unthrecover.managed=true)
          if [ -n "$left" ]; then echo "Leftover resources: $left"; exit 1; fi
