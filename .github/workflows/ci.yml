name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Lint (vet, gofmt, staticcheck)
        run: make lint
      - name: rclone (pinned, checksum-verified) for the rclone backend tests
        run: sudo sh scripts/install-rclone.sh
      - name: Unit tests (race)
        run: make test-race
      - name: Build
        run: make build && ./bin/unth version
      - name: Installer tests
        run: make test-install
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web panel builds from source and matches the embedded copy
        run: |
          make web
          git diff --exit-code -- internal/web/dist || { echo "internal/web/dist is stale: run make web and commit"; exit 1; }
      - name: govulncheck
        run: make vuln
      - name: gosec
        run: make sec

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }}, client ${{ matrix.client }})
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "12", client: "16" }
          - { pg: "13", client: "16" }
          - { pg: "14", client: "16" }
          - { pg: "15", client: "16" }
          - { pg: "16", client: "16" }
          - { pg: "17", client: "17" }
    env:
      # Source and restore use the same major version, as in production use.
      UNTH_TEST_SOURCE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_RESTORE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_TINY_FS: /mnt/unth-tiny
      UNTH_TEST_BROWSER: ${{ matrix.pg == '16' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL ${{ matrix.client }} client tools (PGDG)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.client }}
          echo "/usr/lib/postgresql/${{ matrix.client }}/bin" >> "$GITHUB_PATH"
      - name: rclone (pinned, checksum-verified)
        run: sudo sh scripts/install-rclone.sh
      - name: Tool versions
        run: pg_dump --version && pg_restore --version && rclone version | head -1 && docker info --format 'Docker {{.ServerVersion}}'
      - name: Browser for the web panel e2e test (PostgreSQL 16 leg)
        if: matrix.pg == '16'
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Tiny tmpfs for the disk-full test
        run: |
          sudo mkdir -p "$UNTH_TEST_TINY_FS"
          sudo mount -t tmpfs -o "size=448k,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$UNTH_TEST_TINY_FS"
      - name: Integration tests
        # UNTH_INTEGRATION_REQUIRED=1 makes missing prerequisites FAIL instead of skip.
        run: make test-integration
      - name: Leftover resource check
        if: always()
        run: |
          left=$(docker ps -aq --filter label=io.unthrecover.managed=true; docker volume ls -q --filter label=io.unthrecover.managed=true; docker network ls -q --filter label=io.unthrecover.managed=true)
          if [ -n "$left" ]; then echo "Leftover resources: $left"; exit 1; fi

  packaging:
    name: Packaging (.deb/.rpm + container image, PostgreSQL ${{ matrix.pg }} source)
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        pg: ["12", "16", "17"]
    env:
      UNTH_TEST_SOURCE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_RESTORE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_IMAGE: unthrecover:ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build release artifacts (binaries, .deb, .rpm, SHA256SUMS)
        run: make dist VERSION=v0.0.0-ci
      - name: Install the .deb in a clean Debian container
        if: matrix.pg == '16'
        run: sh scripts/test-deb.sh dist/unthrecover_0.0.0-ci_amd64.deb
      - name: Install the .rpm in clean Rocky Linux 9 and Fedora containers
        if: matrix.pg == '16'
        run: |
          sh scripts/test-rpm.sh dist/unthrecover_0.0.0-ci_amd64.rpm rockylinux:9
          sh scripts/test-rpm.sh dist/unthrecover_0.0.0-ci_amd64.rpm fedora:41
      - name: Build the container image (PGDG clients 13-17)
        run: |
          docker build --build-arg VERSION=v0.0.0-ci -t unthrecover:ci .
          docker run --rm --entrypoint rclone unthrecover:ci version | head -1
      - name: Host PostgreSQL client for the test harness
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
      - name: unth inside the container (docker run and Compose) backs up and verifies PostgreSQL ${{ matrix.pg }} and a volume
        run: UNTH_INTEGRATION_REQUIRED=1 go test -tags integration -count=1 -timeout 20m -v -run 'TestContainerImageRunsJob|TestComposeDeployment|TestDiscoverJobsCoolify' ./tests/integration/...

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 git --no-banner --redact .
