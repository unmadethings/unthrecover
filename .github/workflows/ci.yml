name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Lint (vet, gofmt, staticcheck)
        run: make lint
      - name: Unit tests (race)
        run: make test-race
      - name: Build
        run: make build && ./bin/unth version
      - name: govulncheck
        run: make vuln
      - name: gosec
        run: make sec

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }}, client ${{ matrix.client }})
    runs-on: ubuntu-24.04
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "12", client: "16" }
          - { pg: "13", client: "16" }
          - { pg: "14", client: "16" }
          - { pg: "15", client: "16" }
          - { pg: "16", client: "16" }
          - { pg: "17", client: "17" }
    env:
      # Source and restore use the same major version, as in production use.
      UNTH_TEST_SOURCE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_RESTORE_IMAGE: postgres:${{ matrix.pg }}-alpine
      UNTH_TEST_TINY_FS: /mnt/unth-tiny
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL ${{ matrix.client }} client tools (PGDG)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.client }}
          echo "/usr/lib/postgresql/${{ matrix.client }}/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: pg_dump --version && pg_restore --version && docker info --format 'Docker {{.ServerVersion}}'
      - name: Tiny tmpfs for the disk-full test
        run: |
          sudo mkdir -p "$UNTH_TEST_TINY_FS"
          sudo mount -t tmpfs -o "size=448k,mode=0700,uid=$(id -u),gid=$(id -g)" tmpfs "$UNTH_TEST_TINY_FS"
      - name: Integration tests
        # UNTH_INTEGRATION_REQUIRED=1 makes missing prerequisites FAIL instead of skip.
        run: make test-integration
      - name: Leftover resource check
        if: always()
        run: |
          left=$(docker ps -aq --filter label=io.unthrecover.managed=true; docker volume ls -q --filter label=io.unthrecover.managed=true; docker network ls -q --filter label=io.unthrecover.managed=true)
          if [ -n "$left" ]; then echo "Leftover resources: $left"; exit 1; fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 git --no-banner --redact .
