name: Release

# Builds release artifacts for a pushed tag and creates a DRAFT GitHub
# release. A maintainer reviews the draft (notes, known limitations,
# test evidence) and publishes it manually.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Full test suite
        run: make check test-integration
      - name: Build artifacts and checksums
        run: make dist VERSION=${GITHUB_REF_NAME}
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease \
            --title "Unth Recover $GITHUB_REF_NAME" \
            --notes "Draft. See CHANGELOG.md and docs/RELEASE_CRITERIA.md. Pre-release software: not production-ready."
