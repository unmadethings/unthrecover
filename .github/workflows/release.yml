name: Release

# Builds release artifacts and creates a DRAFT GitHub pre-release.
# Two ways to start it:
#   1. push a tag "v*"                                   (tag already exists)
#   2. "Run workflow" (workflow_dispatch) with a version  (GitHub creates the
#      tag on the tested commit when the draft release is created)
# A maintainer reviews the draft (notes, known limitations, test evidence)
# and publishes it manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0-alpha"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid version: $VERSION"; exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse an existing tag on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists"; exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Full test suite
        run: make check test-integration
      - name: Vulnerability scan
        run: make vuln
      - name: Build artifacts, .deb/.rpm packages and checksums
        env:
          # The project's Google OAuth client ("Desktop app"): lets users connect
          # their own Google Drive from the panel. Not confidential for installed apps.
          UNTH_GOOGLE_CLIENT_ID: ${{ secrets.UNTH_GOOGLE_CLIENT_ID }}
          UNTH_GOOGLE_CLIENT_SECRET: ${{ secrets.UNTH_GOOGLE_CLIENT_SECRET }}
          # Browser API key for Google's folder picker (public, Picker API only).
          UNTH_GOOGLE_API_KEY: ${{ secrets.UNTH_GOOGLE_API_KEY }}
        run: make dist VERSION="$VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Container image (linux/amd64, linux/arm64) from the release binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "Unth Recover $VERSION" \
            --notes-file - <<'EOF'
          **Pre-release — not production-ready.**

          M0: PostgreSQL recovery proof. Backs up a PostgreSQL database and proves it can be
          recovered by restoring it into a fresh isolated container and comparing data, schema
          and constraints with the source snapshot.

          - Changes: see CHANGELOG.md
          - Test evidence: docs/TEST_RESULTS.md
          - Known limitations: Linux only; tested with PostgreSQL 16; backups are not encrypted;
            checksums are not signatures; roles/privileges are not verified.
          - Verify downloads: `sha256sum -c SHA256SUMS --ignore-missing`
          EOF
