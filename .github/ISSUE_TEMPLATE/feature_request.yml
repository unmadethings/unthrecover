name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recovery problem are you trying to solve? Real-world context helps prioritisation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Could this touch production data, weaken isolation, or affect what VERIFIED means?
